# Local development database. Same major version as new Supabase projects.
# Credentials are for this throwaway local container only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: labsimulator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labsimulator"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
