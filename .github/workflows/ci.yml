name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore && dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Fail if the model changed without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/LabSimulator.Api --no-build --configuration Release

      # dotnet ef writes a UTF-8 BOM that PostgreSQL rejects ("syntax error at or near DO").
      - name: Generate idempotent SQL script
        run: |
          dotnet ef migrations script --idempotent --project src/LabSimulator.Api --no-build --configuration Release --output artifacts/schema.sql
          sed -i '1s/^\xEF\xBB\xBF//' artifacts/schema.sql

      - uses: actions/upload-artifact@v7
        with:
          name: schema-sql
          path: artifacts/schema.sql

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag labsimulator-api:${{ github.sha }} .
